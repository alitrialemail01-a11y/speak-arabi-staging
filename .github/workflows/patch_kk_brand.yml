name: patch kk brand

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch publish.yml
        run: |
          python3 - <<'PY'
          import io, re
          path = ".github/workflows/publish.yml"
          src = io.open(path, encoding="utf-8").read()
          rep = []
          def mask(s):
              return re.sub(r"[A-Z][A-Z0-9_]{3,}", "NAME", s)[:200]
          if "_KK" in src:
              rep.append("already patched - no change")
          else:
              pat = re.compile(r"(\S+)\s*==\s*'saudi'\s*&&\s*secrets\.([A-Z0-9_]+)_SAUDI\s*\|\|\s*\1\s*!=\s*'saudi'\s*&&\s*secrets\.([A-Z0-9_]+)")
              hits = []
              def sub(m):
                  b, nm, dflt = m.group(1), m.group(2), m.group(3)
                  hits.append(nm)
                  return (b + " == 'saudi' && secrets." + nm + "_SAUDI"
                          + " || " + b + " == 'kk' && secrets." + nm + "_KK"
                          + " || " + b + " != 'saudi' && " + b + " != 'kk' && secrets." + dflt)
              out = pat.sub(sub, src)
              rep.append("matches: %d" % len(hits))
              rep.append("names: %s" % sorted(hits))
              ok = True
              if len(hits) != 4:
                  ok = False
                  rep.append("FAIL wrong match count")
                  for n in (15, 16, 17, 18):
                      L = src.split(chr(10))
                      if n < len(L):
                          rep.append("sample %d: %s" % (n+1, mask(L[n])))
              if ok and out.count("_KK") != 4:
                  ok = False
                  rep.append("FAIL kk ref count %d" % out.count("_KK"))
              if ok and out.count("_SAUDI") != src.count("_SAUDI"):
                  ok = False
                  rep.append("FAIL saudi ref count changed")
              if ok and out.count(chr(10)) != src.count(chr(10)):
                  ok = False
                  rep.append("FAIL line count changed")
              if ok:
                  io.open(path, "w", encoding="utf-8").write(out)
                  rep.append("PATCH WRITTEN")
          io.open(".github/KK_PATCH_REPORT.txt", "w", encoding="utf-8").write(chr(10).join(rep) + chr(10))
          print(chr(10).join(rep))
          PY

      - name: Validate YAML, revert if broken
        run: |
          pip install pyyaml -q
          python3 - <<'PY'
          import io, yaml
          rep = io.open(".github/KK_PATCH_REPORT.txt", encoding="utf-8").read()
          try:
              d = yaml.safe_load(open(".github/workflows/publish.yml", encoding="utf-8"))
              jobs = d.get("jobs") or {}
              steps = list(jobs.values())[0].get("steps") if jobs else []
              if not jobs or len(steps or []) < 8:
                  raise ValueError("structure collapsed")
              rep += "YAML OK: %d jobs, %d steps" % (len(jobs), len(steps)) + chr(10)
          except Exception as e:
              rep += "YAML BROKEN: %s - reverting" % e + chr(10)
              import subprocess
              subprocess.run(["git", "checkout", "--", ".github/workflows/publish.yml"])
          io.open(".github/KK_PATCH_REPORT.txt", "w", encoding="utf-8").write(rep)
          print(rep)
          PY

      - name: Commit
        run: |
          rm -f .github/BRAND_SHAPE.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .github/
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "publish: add kk brand branch for Kalam Khaleeji"
          git push
