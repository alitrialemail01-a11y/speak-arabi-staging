name: patch kk brand

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch publish.yml
        run: |
          python3 - <<'PY'
          import io, re, sys
          path = ".github/workflows/publish.yml"
          src = io.open(path, encoding="utf-8").read()
          before_nl = src.count(chr(10))
          before_saudi = src.count("_SAUDI")
          if "_KK" in src:
              print("already patched")
              sys.exit(0)
          q = chr(39)
          pat = re.compile(
              r"(\S+)\s*==\s*" + q + r"saudi" + q + r"\s*&&\s*secrets\.([A-Z0-9_]+)_SAUDI"
              r"\s*\|\|\s*\1\s*!=\s*" + q + r"saudi" + q + r"\s*&&\s*secrets\.([A-Z0-9_]+)")
          hits = []
          def sub(m):
              b, nm, dflt = m.group(1), m.group(2), m.group(3)
              hits.append(nm)
              return (b + " == " + q + "saudi" + q + " && secrets." + nm + "_SAUDI"
                      + " || " + b + " == " + q + "kk" + q + " && secrets." + nm + "_KK"
                      + " || " + b + " != " + q + "saudi" + q
                      + " && " + b + " != " + q + "kk" + q + " && secrets." + dflt)
          out = pat.sub(sub, src)
          if len(hits) != 4:
              raise SystemExit("expected 4 brand-selected secrets, matched %d: %s" % (len(hits), hits))
          if out.count("_KK") != 4:
              raise SystemExit("expected 4 _KK refs, got %d" % out.count("_KK"))
          if out.count("_SAUDI") != before_saudi:
              raise SystemExit("saudi refs changed")
          if out.count(chr(10)) != before_nl:
              raise SystemExit("line count changed")
          io.open(path, "w", encoding="utf-8").write(out)
          print("patched:", sorted(hits))
          PY

      - name: Validate YAML
        run: |
          pip install pyyaml -q
          python3 - <<'PY'
          import yaml
          d = yaml.safe_load(open(".github/workflows/publish.yml", encoding="utf-8"))
          jobs = d.get("jobs") or {}
          if not jobs:
              raise SystemExit("no jobs parsed - YAML is broken")
          steps = list(jobs.values())[0].get("steps") or []
          if len(steps) < 8:
              raise SystemExit("step count collapsed to %d" % len(steps))
          print("YAML ok:", len(jobs), "job(s),", len(steps), "steps")
          PY

      - name: Remove temp shape file
        run: rm -f .github/BRAND_SHAPE.txt

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/publish.yml .github/BRAND_SHAPE.txt
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "publish: add kk brand branch for Kalam Khaleeji"
          git push
