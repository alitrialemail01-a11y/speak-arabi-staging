name: patch kk brand

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  describe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write masked shape
        run: |
          python3 - <<'PY'
          import io, re
          src = io.open(".github/workflows/publish.yml", encoding="utf-8").read()
          L = src.split(chr(10))
          out = []
          for n, s in enumerate(L, start=1):
              if "secrets." in s or "BRAND" in s or "brand" in s:
                  masked = re.sub(r"[A-Z][A-Z0-9_]{3,}", "NAME", s)
                  masked = masked.replace("secrets.", "S.")
                  out.append("%d | %s" % (n, masked[:170]))
          io.open(".github/BRAND_SHAPE.txt", "w", encoding="utf-8").write(chr(10).join(out) + chr(10))
          print("wrote", len(out), "lines")
          PY

      - name: Commit shape file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/BRAND_SHAPE.txt
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "temp: masked brand-expression shape for inspection"
          git push
