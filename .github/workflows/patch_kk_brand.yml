name: patch kk brand

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch publish.yml
        run: |
          python3 - <<'PY'
          import io, re, sys
          path = ".github/workflows/publish.yml"
          src = io.open(path, encoding="utf-8").read()
          before_lines = src.count(chr(10))
          before_saudi = src.count("_SAUDI")
          if "_KK" in src:
              print("already patched")
              sys.exit(0)
          pat = re.compile(r"(\S+\s*==\s*.saudi.)\s*&&\s*secrets\.([A-Z0-9_]+)_SAUDI\s*\|\|\s*secrets\.([A-Z0-9_]+)")
          hits = []
          def sub(m):
              cond, nm, dflt = m.group(1), m.group(2), m.group(3)
              hits.append(nm)
              kk = cond.replace("saudi", "kk")
              return "%s && secrets.%s_SAUDI || %s && secrets.%s_KK || secrets.%s" % (cond, nm, kk, nm, dflt)
          out = pat.sub(sub, src)
          if len(hits) != 4:
              raise SystemExit("expected 4 brand-selected secrets, matched %d: %s" % (len(hits), hits))
          if out.count("_KK") != 4:
              raise SystemExit("expected 4 _KK refs, got %d" % out.count("_KK"))
          if out.count("_SAUDI") != before_saudi:
              raise SystemExit("saudi refs changed")
          if out.count(chr(10)) != before_lines:
              raise SystemExit("line count changed")
          io.open(path, "w", encoding="utf-8").write(out)
          print("patched secrets:", sorted(hits))
          PY

      - name: Validate YAML
        run: |
          pip install pyyaml -q
          python3 - <<'PY'
          import yaml
          d = yaml.safe_load(open(".github/workflows/publish.yml", encoding="utf-8"))
          jobs = d.get("jobs") or {}
          if not jobs:
              raise SystemExit("no jobs parsed - YAML is broken")
          steps = list(jobs.values())[0].get("steps") or []
          print("YAML ok:", len(jobs), "job(s),", len(steps), "steps")
          PY

      - name: Report any other brand branching
        run: |
          echo "line numbers that still compare against a brand name:"
          grep -n "== *.saudi" .github/workflows/publish.yml | cut -d: -f1 | tr "\n" " " || true
          echo ""

      - name: Commit
        run: |
          if git diff --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish.yml
          git commit -m "publish: add kk brand branch for Kalam Khaleeji"
          git push
